name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_release.py
      - name: Installer cold-start, upgrade and uninstall (isolated, no systemd)
        run: RUN_INSTALLER_SMOKE=1 python -m unittest discover -s tests -p test_cold_start.py -v
